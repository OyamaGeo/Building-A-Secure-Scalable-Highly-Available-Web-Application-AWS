AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Security groups for the Capstone application load balancer,
  private application servers, and private MySQL database.

Parameters:
  EnvironmentName:
    Type: String
    Default: Oyama-Capstone

Resources:

  # Security group for the Application Load Balancer
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP traffic to the load balancer
      VpcId:
        Fn::ImportValue:
          Fn::Sub: '${EnvironmentName}-VPC-ID'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ALB-SG'

  # Security group for private application servers
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic only from the load balancer
      VpcId:
        Fn::ImportValue:
          Fn::Sub: '${EnvironmentName}-VPC-ID'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-App-SG'

  # Security group for the RDS MySQL database
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL traffic only from application servers
      VpcId:
        Fn::ImportValue:
          Fn::Sub: '${EnvironmentName}-VPC-ID'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Database-SG'

Outputs:

  ALBSecurityGroupId:
    Description: Security group ID for the Application Load Balancer
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-ALB-SG-ID'

  AppSecurityGroupId:
    Description: Security group ID for the application servers
    Value: !Ref AppSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-App-SG-ID'

  DatabaseSecurityGroupId:
    Description: Security group ID for the RDS database
    Value: !Ref DatabaseSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-Database-SG-ID'
